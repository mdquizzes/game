<!-- Dashboard / Leaderboard Box -->
<div style="max-width:500px; margin:20px auto; background:#1e293b; padding:20px; border-radius:12px; font-family:sans-serif;">
  <h2 style="color:#facc15; text-align:center; margin-top:0;">🏆 Live Game Leaderboard</h2>
  
  <!-- Yahan live ranking dynamically render hogi -->
  <div id="leaderboardList">Loading ranks...</div>
</div>

<script>
  // Page load hone par live listener shuru karein
  window.addEventListener("DOMContentLoaded", () => {
    window.loadLiveLeaderboard("leaderboardList", 10);
  });
</script>
