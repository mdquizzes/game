<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roman Bubble Challenge v2</title>

<!-- STEP 4.0: Link Common Game Bridge Script -->
<script src="https://game.cbsesir.com/game-bridge.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: Arial,sans-serif;
}

body{
height:100vh;
overflow:hidden;
background: linear-gradient(135deg, #4facfe, #00f2fe);
}

#gameArea{
position:absolute;
inset:0;
overflow:hidden;
}

#setupScreen{
position:absolute;
inset:0;
background: rgba(0, 0, 0, 0.6);
display:flex;
justify-content:center;
align-items:center;
z-index:1000;
}

.setupBox{
background:white;
padding:25px;
border-radius:20px;
width:340px;
text-align:center;
}

.setupBox h1{
margin-bottom:15px;
font-size:28px;
}

.setupBox input,
.setupBox select{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
}

.setupBox button{
width:100%;
padding:14px;
font-size:18px;
border:none;
background:#2196f3;
color:white;
border-radius:10px;
cursor:pointer;
}

.setupBox button:hover{
background:#1976d2;
}

#authStatusNotice{
font-size: 13px;
margin-top: 10px;
color: #475569;
}

#hud{
position:absolute;
top:10px;
left:10px;
right:260px;
display:flex;
justify-content:space-between;
font-weight:bold;
font-size:20px;
color:white;
z-index:999;
}

#leaderboard{
position:absolute;
top:0;
right:0;
width:250px;
height:100%;
background: rgba(0, 0, 0, 0.7);
color:white;
padding:10px;
overflow-y:auto;
z-index:999;
}

#leaderboard h3{
text-align:center;
margin-bottom:10px;
color: #facc15;
}

#leaderList{
list-style:none;
padding:0;
}

#leaderList li{
padding:6px;
border-bottom: 1px solid rgba(255, 255, 255, 0.25);
}

.bubble{
position:absolute;
width:82px;
height:82px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
cursor:pointer;
user-select:none;
color:white;
transition:.2s;
box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
}

.roman{
background:#ff9800;
}

.number{
background:#4caf50;
}

.selected{
outline:5px solid yellow;
box-shadow: 0 0 10px white, 0 0 25px yellow, 0 0 50px yellow;
animation: pulse .6s infinite;
}

@keyframes pulse{
0%{ transform: scale(1.15); }
50%{ transform: scale(1.30); }
100%{ transform: scale(1.15); }
}

.burst{
animation: burst .35s forwards;
}

@keyframes burst{
100%{
transform: scale(2);
opacity:0;
}
}

#floatingMessage{
position:absolute;
left:50%;
top:50%;
transform: translate(-50%, -50%);
font-size:42px;
font-weight:bold;
pointer-events:none;
opacity:0;
z-index:9999;
transition:.4s;
color:yellow;
}

#gameOver{
display:none;
position:absolute;
inset:0;
background: rgba(0, 0, 0, 0.75);
justify-content:center;
align-items:center;
z-index:1001;
}

.overBox{
background:white;
padding:25px;
border-radius:20px;
width:340px;
text-align:center;
}

.overBox button{
margin-top:15px;
padding:12px 20px;
font-size:18px;
cursor:pointer;
}

#cloudSaveStatus{
margin-top: 10px;
font-weight: bold;
font-size: 14px;
}

@media(max-width:700px){
#leaderboard{ width:160px; }
#hud{ right:160px; font-size:14px; }
.bubble{ width:65px; height:65px; font-size:18px; }
}
</style>
</head>

<body>

<div id="setupScreen">
<div class="setupBox">
<h1>Roman Bubble Challenge</h1>

<input id="playerName" placeholder="Enter Player Name">

<select id="timeSelect">
<option value="30">30 Seconds</option>
<option value="60" selected>60 Seconds</option>
<option value="120">120 Seconds</option>
</select>

<select id="levelSelect">
<option value="easy">Easy (1–20)</option>
<option value="medium">Medium (1–50)</option>
<option value="hard">Hard (1–100)</option>
</select>

<button onclick="startGame()">Start Game</button>
<div id="authStatusNotice">Connecting...</div>
</div>
</div>

<div id="hud">
<div>Player: <span id="playerInfo">-</span></div>
<div>Score: <span id="score">0</span></div>
<div>Combo: <span id="combo">0</span></div>
<div>Time: <span id="time">60</span></div>
</div>

<div id="leaderboard">
<h3>🏆 Live Leaders</h3>
<ul id="leaderList">
  <li style="text-align:center; color:#94a3b8;">Loading ranks...</li>
</ul>
</div>

<div id="gameArea"></div>
<div id="floatingMessage"></div>

<div id="gameOver">
<div class="overBox">
<h2>Game Over</h2>
<p id="finalScore"></p>
<div id="cloudSaveStatus"></div>
<button onclick="location.reload()">Play Again</button>
</div>
</div>

<script>
const gameArea = document.getElementById("gameArea");

let score = 0;
let combo = 0;
let selected = null;
let gameTime = 60;
let maxNumber = 20;
let currentLevel = "easy";
let timerInterval;
let spawnInterval;

// =======================================================
// STEP 4.1: Roman Bubble Game ke liye Live Leaderboard Start
// =======================================================
window.addEventListener("DOMContentLoaded", () => {
  if (typeof subscribeToGameLeaderboard === "function") {
    subscribeToGameLeaderboard("roman-bubble", "leaderList", 10);
  }
});

function toRoman(num){
  const values = [
    [100,"C"], [90,"XC"], [50,"L"], [40,"XL"],
    [10,"X"], [9,"IX"], [5,"V"], [4,"IV"], [1,"I"]
  ];
  let result = "";
  for(let [value,symbol] of values){
    while(num >= value){
      result += symbol;
      num -= value;
    }
  }
  return result;
}

function startGame(){
  const playerName = document.getElementById("playerName").value.trim();
  if(!playerName){
    alert("Please enter player name");
    return;
  }

  document.getElementById("playerInfo").textContent = playerName;
  gameTime = parseInt(document.getElementById("timeSelect").value);
  currentLevel = document.getElementById("levelSelect").value;

  if(currentLevel === "easy") maxNumber = 20;
  if(currentLevel === "medium") maxNumber = 50;
  if(currentLevel === "hard") maxNumber = 100;

  document.getElementById("setupScreen").style.display = "none";
  document.getElementById("time").textContent = gameTime;

  timerInterval = setInterval(()=>{
    gameTime--;
    document.getElementById("time").textContent = gameTime;
    if(gameTime <= 0){
      endGame();
    }
  },1000);

  spawnInterval = setInterval(spawnPair, 1100);
}

function spawnPair(){
  const num = Math.floor(Math.random() * maxNumber) + 1;
  const roman = toRoman(num);
  createBubble(roman, "roman", num);
  createBubble(num, "number", num);
}

function createBubble(text, type, value){
  const bubble = document.createElement("div");
  bubble.className = `bubble ${type}`;
  bubble.textContent = text;
  bubble.dataset.type = type;
  bubble.dataset.value = value;
  bubble.style.left = Math.random() * (window.innerWidth - 320) + "px";

  let y;
  if(currentLevel === "easy"){
    y = Math.random() * (window.innerHeight - 220);
  }else{
    y = -100;
  }

  bubble.style.top = y + "px";
  gameArea.appendChild(bubble);

  bubble.addEventListener("click", function(e){
    e.stopPropagation();
    selectBubble(bubble);
  });

  let speed;
  if(currentLevel === "easy"){
    speed = 0.25 + Math.random()*0.30;
  } else if(currentLevel === "medium"){
    speed = 1.20 + Math.random()*1.20;
  } else {
    speed = 2.50 + Math.random()*2.50;
  }

  const drift = (Math.random() - 0.5) * 1.5;

  const move = setInterval(()=>{
    if(currentLevel === "easy"){
      bubble.style.left = (parseFloat(bubble.style.left) + drift) +"px";
      y -= speed;
    } else {
      y += speed;
    }
    bubble.style.top = y + "px";

    if(y > window.innerHeight + 120 || y < -120){
      if(selected === bubble){
        bubble.classList.remove("selected");
        selected = null;
        showWrongPair();
      }
      clearInterval(move);
      bubble.remove();
    }
  }, 16);
}

function selectBubble(bubble){
  if(selected === null){
    selected = bubble;
    bubble.classList.add("selected");
    return;
  }

  if(selected === bubble) return;

  if(selected.dataset.value === bubble.dataset.value && selected.dataset.type !== bubble.dataset.type){
    correctMatch(selected, bubble);
  } else {
    selected.classList.remove("selected");
    showWrongPair();
    selected = null;
    combo = 0;
    document.getElementById("combo").textContent = 0;
  }
}

function correctMatch(first, second){
  burst(first);
  burst(second);
  selected = null;
  combo++;
  document.getElementById("combo").textContent = combo;

  let points = 2;
  if(combo >= 3){
    points = 3;
  }

  score += points;
  document.getElementById("score").textContent = score;
  showMessage("+" + points, "yellow");
}

function burst(bubble){
  bubble.classList.add("burst");
  setTimeout(()=>{
    bubble.remove();
  }, 350);
}

function showWrongPair(){
  showMessage("❌ Wrong Pair", "#ff4444");
}

function showMessage(text, color){
  const msg = document.getElementById("floatingMessage");
  msg.innerHTML = text;
  msg.style.color = color;
  msg.style.opacity = "1";
  msg.style.transform = "translate(-50%,-50%) scale(1.3)";
  setTimeout(()=>{
    msg.style.opacity = "0";
    msg.style.transform = "translate(-50%,-50%) scale(1)";
  }, 700);
}

gameArea.addEventListener("click", function(e){
  if(e.target === gameArea && selected){
    selected.classList.remove("selected");
    selected = null;
  }
});

function endGame(){
  clearInterval(timerInterval);
  clearInterval(spawnInterval);

  document.querySelectorAll(".bubble").forEach(b => b.remove());

  const playerName = document.getElementById("playerInfo").textContent;

  document.getElementById("finalScore").innerHTML = `
    <h3>${playerName}</h3>
    <br>
    Final Score: <b>${score}</b>
  `;
  document.getElementById("gameOver").style.display = "flex";

  // =======================================================
  // STEP 4.2: Game Over hone par score Cloud me Save
  // =======================================================
  if (typeof submitFinalGameScore === "function") {
    submitFinalGameScore("roman-bubble", score);
  }
}

window.addEventListener("resize", ()=>{
  document.querySelectorAll(".bubble").forEach(b=>{
    let left = parseFloat(b.style.left);
    const maxLeft = window.innerWidth - 320;
    if(left > maxLeft){
      b.style.left = maxLeft + "px";
    }
  });
});
</script>
</body>
</html>
